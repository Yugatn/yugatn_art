name: Apply prototype 0.5
on:
  push:
    paths:
      - 'scripts/apply-v0.5.py'
      - '.github/workflows/apply-v0.5.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
      - name: Apply v0.5 transformations
        run: python3 scripts/apply-v0.5.py
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: prototype 0.5 — lock/alphaLock restored + streamline stabilizer + layer thumbs"
            git push
          fi
