name: Deploy static prototype to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Requires repository Settings → Pages → Source = GitHub Actions.
# The repository owner must enable Pages once; this workflow cannot create
# the Pages site when its token lacks repository administration permission.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate canonical source
        run: |
          python3 scripts/validate-prototype.py --extract-script /tmp/yugatn-art-app.js
          node --check /tmp/yugatn-art-app.js
      - name: Prepare minimal publish artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          : > _site/.nojekyll
          test -s _site/index.html
          grep -q 'Prototype 0.5' _site/index.html
          # Allowlist: publish only the app shell, not repository source/docs/scripts.
          test "$(find _site -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
