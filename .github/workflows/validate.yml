name: Validate prototype source

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML structure and DOM hooks
        run: python3 scripts/validate-prototype.py --extract-script /tmp/yugatn-art-app.js
      - name: Check JavaScript syntax
        run: node --check /tmp/yugatn-art-app.js
