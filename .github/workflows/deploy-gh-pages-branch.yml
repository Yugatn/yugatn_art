name: Deploy static site to gh-pages branch

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Publishes a strict allowlist from the canonical index.html.
# Owner can set Settings → Pages → Source → Deploy from a branch → gh-pages / (root).

permissions:
  contents: write

concurrency:
  group: "gh-pages-branch"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate canonical source
        run: |
          python3 scripts/validate-prototype.py --extract-script /tmp/yugatn-art-app.js
          node --check /tmp/yugatn-art-app.js
      - name: Prepare minimal publish directory
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          : > _site/.nojekyll
          test -s _site/index.html
          grep -q 'Prototype 0.5' _site/index.html
          test "$(find _site -maxdepth 1 -type f | wc -l | tr -d ' ')" = "2"
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: minimal static prototype from main"
